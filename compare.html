<script type="text/javascript">
    //<![CDATA[

    const jsonNetworkTargetDiv = document.getElementById("jsonNetworkDiv");
    const jsonCv = new complexviewer.App(jsonNetworkTargetDiv);
    const xmlNetworkTargetDiv = document.getElementById("xmlNetworkDiv");
    const xmlCv = new complexviewer.App(xmlNetworkTargetDiv);

    function setAnnotations(checkbox) {
        var json = cv.showAnnotations(checkbox.value, checkbox.checked);
        console.log(json);
        makeLegend(json);
    }

    // you can use code below as template to make legend from json
    function makeLegend(json, divId) {
        const div = document.getElementById(divId);
        div.textContent = "";
        const colorTable = document.createElement("table");
        for (let majorClass in json) {
            const tr = colorTable.insertRow();
            const headerCell = tr.insertCell();
            headerCell.textContent = majorClass;
            headerCell.colSpan = 3;
            for (let legendEntry of json[majorClass]) {
                const tr = colorTable.insertRow();
                if (legendEntry.certain && legendEntry.uncertain) {
                    const tc1 = tr.insertCell();
                    tc1.style.backgroundColor = legendEntry.certain.color;
                    tc1.style.width = "45px";
                    const tc2 = tr.insertCell();
                    const color = legendEntry.uncertain.color
                    tc2.style.background = "repeating-linear-gradient(45deg, #ffffff, #ffffff 6px, "+color+" 6px, "+color+" 12px)";
                    tc2.style.width = "45px";
                }
                else if (legendEntry.certain) {
                    const tc1 = tr.insertCell();
                    tc1.style.backgroundColor = legendEntry.certain.color;
                    tc1.style.width = "90px";
                    tc1.colSpan = 2;
                }
                else if (legendEntry.uncertain) {
                    const tc1 = tr.insertCell();
                    const color = legendEntry.uncertain.color
                    tc1.style.background = "repeating-linear-gradient(45deg, #ffffff, #ffffff 6px, "+color+" 6px, "+color+" 12px)";
                    tc1.style.width = "90px";
                    tc1.colSpan = 2;
                }
                const tc3 = tr.insertCell();
                tc3.style.paddingLeft = "10px";
                tc3.textContent = legendEntry.name;
            }
        }
        div.appendChild(colorTable);
    }

    document.getElementById('accession').addEventListener('change', function (event) {
        jsonCv.clear();
        xmlCv.clear();

        //clear counts and legend div
        const jsonSummaryDiv = document.getElementById("jsonSummaryDiv");
        jsonSummaryDiv.textContent = "";
        const xmlSummaryDiv = document.getElementById("xmlSummaryDiv");
        xmlSummaryDiv.textContent = "";
        const jsonLegendDiv = document.getElementById("jsonLegendDiv");
        jsonLegendDiv.textContent = "";
        const xmlLegendDiv = document.getElementById("xmlLegendDiv");
        xmlLegendDiv.textContent = "";

        let jsonUrl, xmlUrl;
        const accession = event.target.value.toUpperCase();
        if (accession.startsWith("CPX-")) {
            //example: https://www.ebi.ac.uk/intact/complex-ws/export/CPX-2158?filters=&format=json&filename=CPX-2158.json
            jsonUrl = `https://www.ebi.ac.uk/intact/complex-ws/export/${accession}?filters=&format=json&filename=${accession}.json`;
            // example: https://www.ebi.ac.uk/intact/complex-ws/export/CPX-2158?filters=&format=xml30&filename=CPX-2158.xml
            xmlUrl = `https://www.ebi.ac.uk/intact/complex-ws/export/${accession}?filters=&format=xml30&filename=${accession}.xml`;
        } else if (accession.startsWith("EBI-")) {
            //example: https://www.ebi.ac.uk/intact/ws/graph/export/interaction/EBI-12598622?format=miJSON
            jsonUrl = `https://www.ebi.ac.uk/intact/ws/graph/export/interaction/${accession}?format=miJSON`;
            //example: https://www.ebi.ac.uk/intact/ws/graph/export/interaction/EBI-12598622?format=miXML30
            xmlUrl = `https://www.ebi.ac.uk/intact/ws/graph/export/interaction/${accession}?format=miXML30`;
        } else {
            alert("Please enter a valid accession number (CPX-* or EBI-*)");
            return;
        }

        const stoichiometry = document.querySelector('input[name="choice"]:checked').value;

        //function to print summary stas into a div
        function printSummaryStats(cv, divId) {
            const div = document.getElementById(divId);
            div.textContent = "";
            const summaryStats = cv.getSummaryStats();
            for (const [key, value] of Object.entries(summaryStats)) {
                div.textContent += `${key}: ${value}, `;
            }
        }

        //download json data
        fetch(jsonUrl)
            .then(response => response.json())
            .then(data => {
                jsonCv.readMIJSON(data, stoichiometry);
                makeLegend(jsonCv.getColorKeyJson(), "jsonLegendDiv");
                printSummaryStats(jsonCv, "jsonSummaryDiv");
            })
            .catch(error => console.error('Error fetching JSON:', error));

        //download xml data
        fetch(xmlUrl)
            .then(response => response.text())
            .then(data => {
                xmlCv.readXML(data, stoichiometry);
                makeLegend(xmlCv.getColorKeyJson(), "xmlLegendDiv");
                printSummaryStats(xmlCv, "xmlSummaryDiv");
            })
            .catch(error => console.error('Error fetching XML:', error));

    });

    //]]>
</script>
